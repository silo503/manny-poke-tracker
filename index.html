<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Manny Poke Tracker"><link rel="manifest" href="./manifest.json"><title>Manny Poke Tracker</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:22px 16px 18px;position:sticky;top:0;z-index:2}h1{margin:0;font-size:25px}.sub{opacity:.75;margin-top:4px;font-size:13px}main{max-width:900px;margin:auto;padding:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select,.toolbar button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:15px}button{cursor:pointer}.primary{background:#2563eb!important;color:#fff;border:0!important;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px #0001}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:#6b7280}.card{background:#fff;border-radius:16px;padding:15px;margin:9px 0;box-shadow:0 1px 4px #0001}.row{display:flex;justify-content:space-between;gap:12px}.name{font-weight:750}.store{font-size:12px;color:#6b7280;margin-top:4px}.price{font-weight:750}.badge{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.in{background:#dcfce7;color:#166534}.out{background:#fee2e2;color:#991b1b}.watch{background:#fef3c7;color:#92400e}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.actions a{flex:1;padding:10px;border-radius:10px;text-align:center}.actions button{border:1px solid #d1d5db;background:#fff}.actions a{background:#111827;color:#fff;text-decoration:none;font-size:14px}.empty{padding:30px;text-align:center;color:#6b7280}.foot{font-size:12px;color:#6b7280;text-align:center;padding:20px}@media(max-width:520px){.toolbar{grid-template-columns:1fr}}</style></head><body><header><h1>🎴 Manny Poke Tracker</h1><div class="sub">Pokémon TCG restock tracker</div></header><main><div class="toolbar"><input id="search" placeholder="Search Pokémon products…"><select id="store"><option value="">All stores</option><option>Best Buy</option><option>Target</option><option>Walmart</option><option>GameStop</option><option>Pokémon Center</option><option>Costco</option></select><select id="filter"><option value="all">All</option><option value="in">In Stock</option><option value="watch">Watching</option></select><button class="primary" id="check">🔄 Check for restocks</button></div><div class="stats"><div class="stat"><b id="tracked">0</b><span>Tracked</span></div><div class="stat"><b id="stock">0</b><span>In stock</span></div><div class="stat"><b id="watching">0</b><span>Watching</span></div></div><section id="list"></section><div class="foot">Manny Poke Tracker • Live inventory depends on authorized retailer feeds.</div></main><script>const demo=[{id:"1",name:"Pokémon TCG Elite Trainer Box",store:"Best Buy",price:49.99,status:"in",watch:true,url:"https://www.bestbuy.com/"},{id:"2",name:"Pokémon TCG Booster Bundle",store:"Target",price:26.99,status:"out",watch:true,url:"https://www.target.com/"},{id:"3",name:"Pokémon TCG Collection Box",store:"Walmart",price:29.99,status:"out",watch:false,url:"https://www.walmart.com/"}];let products=JSON.parse(localStorage.getItem("mpt-products")||"null")||demo;const $=id=>document.getElementById(id);function render(){const q=$("search").value.toLowerCase(),s=$("store").value,f=$("filter").value;const shown=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!s||p.store===s)&&(f==="all"||(f==="in"&&p.status==="in")||(f==="watch"&&p.watch)));$("tracked").textContent=products.length;$("stock").textContent=products.filter(p=>p.status==="in").length;$("watching").textContent=products.filter(p=>p.watch).length;$("list").innerHTML=shown.length?shown.map(p=>'<article class="card"><div class="row"><div><div class="name">'+p.name+'</div><div class="store">'+p.store+'</div></div><div class="price">$'+Number(p.price||0).toFixed(2)+'</div></div><span class="badge '+(p.status==="in"?"in":"out")+'">'+(p.status==="in"?"IN STOCK":"OUT OF STOCK")+'</span> '+(p.watch?'<span class="badge watch">WATCHING</span>':"")+'<div class="actions"><button onclick="toggleWatch(\''+p.id+'\')">'+(p.watch?"★ Watching":"☆ Watch")+'</button><a href="'+(p.url||"#")+'" target="_blank" rel="noopener">View store</a></div></article>').join(""):'<div class="empty">No products match your filters.</div>'}function toggleWatch(id){products=products.map(p=>p.id===id?{...p,watch:!p.watch}:p);save();render()}function save(){localStorage.setItem("mpt-products",JSON.stringify(products))}async function sync(){$("check").textContent="Checking…";try{const r=await fetch("./api/products");if(r.ok){const d=await r.json();if(d.products?.length){products=d.products;save()}}}catch(e){}$("check").textContent="🔄 Check for restocks";render()}["search","store","filter"].forEach(id=>$(id).addEventListener("input",render));$("check").addEventListener("click",sync);if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");render();</script></body></html>
